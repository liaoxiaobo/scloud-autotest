<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜像服务自动化场景图</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5c677a;
      --paper: #f6f3ed;
      --panel: #fffdf8;
      --line: #2f3f56;
      --blue: #2f6f9f;
      --teal: #287f77;
      --green: #5e8544;
      --amber: #b0782f;
      --red: #ad5148;
      --gray: #717b86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(135deg, #fbf8f1 0%, #efe8dc 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      width: 1180px;
      margin: 24px auto;
      padding: 30px;
      background: rgba(255, 253, 248, .96);
      border: 1px solid rgba(47, 63, 86, .16);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(47, 63, 86, .14);
    }

    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: 0; }
    .subtitle { margin: 0; color: var(--muted); line-height: 1.65; }
    .diagram { margin-top: 22px; padding: 16px; background: var(--panel); border: 1px solid rgba(47, 63, 86, .12); border-radius: 14px; }
    .notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .note { padding: 14px 16px; border: 1px solid rgba(47, 63, 86, .14); border-radius: 8px; background: #fffaf0; }
    .note strong { display: block; margin-bottom: 6px; color: var(--ink); }
    .note p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    code { font-family: Consolas, "Courier New", monospace; }

    @media print {
      body { background: #fff; }
      .page { margin: 0; box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>镜像服务自动化场景图</h1>
      <p class="subtitle">从 Excel 中 143 条用例抽象为 P0/P1/P2 三层自动化场景：先做稳定页面基线，再做业务闭环，最后覆盖慢速和环境专属矩阵。</p>
    </header>

    <section class="diagram">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-label="镜像服务自动化场景图">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3f56"/>
          </marker>
          <style>
            .box { fill: #fffaf0; stroke: #2f3f56; stroke-opacity: .22; stroke-width: 1.4; }
            .title { font: 700 16px "Microsoft YaHei", sans-serif; fill: #172033; }
            .body { font: 12px "Microsoft YaHei", sans-serif; fill: #5c677a; }
            .tiny { font: 11px "Microsoft YaHei", sans-serif; fill: #717b86; }
            .badge { font: 700 12px "Microsoft YaHei", sans-serif; fill: #fff; }
            .path { fill: none; stroke: #2f3f56; stroke-width: 2; marker-end: url(#arrow); }
            .dash { fill: none; stroke: #717b86; stroke-width: 1.7; stroke-dasharray: 6 6; marker-end: url(#arrow); }
          </style>
        </defs>

        <g transform="translate(34 40)">
          <rect class="box" width="180" height="94" rx="8" fill="#edf6fb"/>
          <rect width="42" height="24" rx="5" fill="#2f6f9f"/>
          <text class="badge" x="11" y="17">源</text>
          <text class="title" x="18" y="46">Excel 用例池</text>
          <text class="body" x="18" y="68">用例 sheet 143 条</text>
          <text class="tiny" x="18" y="86">镜像服务 / ECS / 存储池</text>
        </g>

        <g transform="translate(278 28)">
          <rect class="box" width="210" height="118" rx="8" fill="#f3fbf9"/>
          <rect width="54" height="24" rx="5" fill="#287f77"/>
          <text class="badge" x="10" y="17">筛选</text>
          <text class="title" x="18" y="48">自动化判定</text>
          <text class="body" x="18" y="72">UI 稳定可定位</text>
          <text class="body" x="18" y="92">资源可 fixture 化</text>
          <text class="body" x="18" y="112">UI + SSH 可验证</text>
        </g>

        <path class="path" d="M 214 87 L 278 87"/>

        <g transform="translate(560 26)">
          <rect class="box" width="236" height="122" rx="8" fill="#f5faef"/>
          <rect width="44" height="24" rx="5" fill="#5e8544"/>
          <text class="badge" x="10" y="17">P0</text>
          <text class="title" x="18" y="48">默认回归优先</text>
          <text class="body" x="18" y="72">入口 / 列表 / 详情字段</text>
          <text class="body" x="18" y="92">弹窗校验 / 按钮状态</text>
          <text class="body" x="18" y="112">保护状态 / 下载入口</text>
        </g>

        <g transform="translate(560 188)">
          <rect class="box" width="236" height="136" rx="8" fill="#fff7e8"/>
          <rect width="44" height="24" rx="5" fill="#b0782f"/>
          <text class="badge" x="10" y="17">P1</text>
          <text class="title" x="18" y="48">业务闭环</text>
          <text class="body" x="18" y="72">CRUD / 上传 / 导入</text>
          <text class="body" x="18" y="92">共享模式 / 多租户可见性</text>
          <text class="body" x="18" y="112">存储池同步 / Hash 回显</text>
          <text class="body" x="18" y="130">用镜像创建或重建 ECS</text>
        </g>

        <g transform="translate(560 364)">
          <rect class="box" width="236" height="142" rx="8" fill="#fff1ee"/>
          <rect width="44" height="24" rx="5" fill="#ad5148"/>
          <text class="badge" x="10" y="17">P2</text>
          <text class="title" x="18" y="48">slow / 环境专属</text>
          <text class="body" x="18" y="72">VMDK/VHD/VHDX 格式矩阵</text>
          <text class="body" x="18" y="92">裸金属 / 安全云 / 机密</text>
          <text class="body" x="18" y="112">国密加密 / 解密 / 密钥异常</text>
          <text class="body" x="18" y="132">VNC / 客户端上传 / 异常注入</text>
        </g>

        <path class="path" d="M 488 87 C 522 87 526 87 560 87"/>
        <path class="path" d="M 488 87 C 520 142 520 240 560 256"/>
        <path class="dash" d="M 488 87 C 512 210 514 420 560 435"/>

        <g transform="translate(862 22)">
          <rect class="box" width="222" height="152" rx="8" fill="#edf6fb"/>
          <text class="title" x="18" y="32">Page Object</text>
          <text class="body" x="18" y="58">image_open_detail</text>
          <text class="body" x="18" y="78">image_create / import / upload</text>
          <text class="body" x="18" y="98">image_set_share_mode</text>
          <text class="body" x="18" y="118">image_sync_storage_pool</text>
          <text class="tiny" x="18" y="140">pages/compute/image.py</text>
        </g>

        <g transform="translate(862 220)">
          <rect class="box" width="222" height="148" rx="8" fill="#f3fbf9"/>
          <text class="title" x="18" y="32">Fixture / Helper</text>
          <text class="body" x="18" y="58">private_image / shared_image</text>
          <text class="body" x="18" y="78">image_with_storage_pool</text>
          <text class="body" x="18" y="98">encrypted_image</text>
          <text class="body" x="18" y="118">clean_images</text>
          <text class="tiny" x="18" y="140">testcase/compute/_image_*.py</text>
        </g>

        <g transform="translate(862 414)">
          <rect class="box" width="222" height="156" rx="8" fill="#f5faef"/>
          <text class="title" x="18" y="32">断言与清理</text>
          <text class="body" x="18" y="58">列表 / 详情 / 弹窗断言</text>
          <text class="body" x="18" y="78">scli image list/show/delete</text>
          <text class="body" x="18" y="98">glance image-show</text>
          <text class="body" x="18" y="118">ECS SSH OS 校验</text>
          <text class="tiny" x="18" y="142">common/remote/scli.py</text>
        </g>

        <path class="path" d="M 796 87 L 862 87"/>
        <path class="path" d="M 796 256 L 862 294"/>
        <path class="path" d="M 796 435 L 862 492"/>
        <path class="dash" d="M 973 174 L 973 220"/>
        <path class="dash" d="M 973 368 L 973 414"/>

        <g transform="translate(36 192)">
          <rect class="box" width="452" height="370" rx="8" fill="#fffdf8"/>
          <text class="title" x="20" y="34">场景族</text>
          <text class="body" x="20" y="66">1. 页面基线：入口、列表、详情、弹窗、字段、操作顺序</text>
          <text class="body" x="20" y="94">2. 镜像生命周期：新建、修改、保护、删除、下载</text>
          <text class="body" x="20" y="122">3. 上传与导入：标准上传、快速上传、对象存储 URL 导入</text>
          <text class="body" x="20" y="150">4. 共享模式：全局共享、指定共享、不共享、多租户可见性</text>
          <text class="body" x="20" y="178">5. 存储池：同步、Hash 回显、默认 location 切换、异常删除</text>
          <text class="body" x="20" y="206">6. 镜像消费：创建或重建 ECS、安全云、裸金属</text>
          <text class="body" x="20" y="234">7. 状态机：弃用、恢复、禁用限制、queued 重新上传</text>
          <text class="body" x="20" y="262">8. 格式矩阵：raw、qcow2、VMDK、VHD、VHDX</text>
          <text class="body" x="20" y="290">9. 加密矩阵：HCT、OpenSSL、USAN、ustor、Windows</text>
          <text class="body" x="20" y="318">10. 异常限制：密钥异常、ISO/ARM/其它存储限制、同步失败</text>
          <text class="tiny" x="20" y="350">推荐先实现 1-5，再把 6-10 拆到 slow 或环境专属套件。</text>
        </g>
      </svg>
    </section>

    <section class="notes">
      <div class="note">
        <strong>P0 默认回归</strong>
        <p>短链路、低依赖，适合先补 Page Object 后快速落地。</p>
      </div>
      <div class="note">
        <strong>P1 业务闭环</strong>
        <p>通过 fixture 准备镜像、项目、存储池，使用 UI + SSH 交叉验证。</p>
      </div>
      <div class="note">
        <strong>P2 slow 套件</strong>
        <p>多格式、加密、裸金属、安全云、异常注入单独运行，避免拖慢默认回归。</p>
      </div>
    </section>
  </main>
</body>
</html>
