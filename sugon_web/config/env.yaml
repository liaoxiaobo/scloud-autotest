# 环境配置
# stors   : 该环境支持的存储池列表（如 [xstor, ceph, zbs]）
# dispatch: 调度配置，可以是单个对象，也可以是对象列表。
#           每个条目包含 modules/services/mark/stor，其中 stor 如不填写，
#           默认取该 host 的 stors 第一个。
# 如未配置 dispatch，Jenkins 默认不会把该环境加入多环境调度；
# 可在 Jenkins 构建参数中通过 HOSTS / ENV_DISPATCH 覆盖或补充。
env:
- host: 172.22.1.170
  public_net:
    segment_id: 202
    cidr: 172.22.11.0/24
    gateway_ip: 172.22.11.254
  stors: [xstor]

- host: 172.22.1.184
  public_net:
    segment_id: 212
    cidr: 172.22.13.0/24
    gateway_ip: 172.22.13.254
  stors: [ceph]

- host: 172.22.1.183
  public_net:
    segment_id: 302
    cidr: 172.22.15.0/24
    gateway_ip: 172.22.15.254
    集中式vlan:
      vlan_id: 303
      cidr: 172.22.16.0/24
      gateway_ip: 172.22.16.254
      mac: 60:f1:8a:5a:31:9b
  stors: [xstor]

- host: 172.22.1.185
  public_net:
    segment_id: 222
    cidr: 172.22.20.0/24
    gateway_ip: 172.22.20.254
  stors: [xstor]

- host: 172.22.1.189
  public_net:
    segment_id: 212
    cidr: 172.22.13.128/25
    gateway_ip: 172.22.13.254
  stors: [xstor]

- host: 172.22.1.190
  public_net:
    segment_id: 202
    cidr: 172.22.11.128/25
    gateway_ip: 172.22.11.254
- host: 172.22.3.160
  network: public-new(基础版)
  public_net:
    segment_id: 130
