# =============================================================================
# pytest mark 描述映射表
# =============================================================================
# 作用：
#   1. pytest_configure 动态注册 mark 时使用中文描述
#   2. _resolve_service_mark 按最长前缀匹配文件名，确保多词服务名
#      （如 internal_dns / ip_group / peer_connect）能被正确识别为服务 mark
#
# 维护方式：
#   新增单段服务名（如 ecs / evs / cce）时，无需修改本文件，conftest.py
#   会自动推导并 fallback 使用服务名本身作为描述。
#
#   新增多词服务名（含下划线，如 internal_dns）时，必须在本文件添加
#   对应条目，否则 test_internal_dns_xxx.py 会被错误识别为 internal。
# =============================================================================

# ── 计算服务 ──
bms: 裸金属服务器
ecs: 弹性云服务器

# ── 容器服务 ──
cce: 云容器引擎
scr: 容器镜像服务SCR

