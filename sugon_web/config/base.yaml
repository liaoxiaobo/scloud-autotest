# =============================================================================
# SugonCloud Web 自动化测试框架 - 基础配置文件
# =============================================================================

# -----------------------------------------------------------------------------
# 浏览器配置
# -----------------------------------------------------------------------------

# 浏览器类型 (chromium/firefox/webkit)
browser: chromium

# 无头模式 (true无界面/false有界面)
headless: false

# 操作超时时间(毫秒)
timeout: 10000

# 操作延迟时间(毫秒)
slow_mo: 0

# -----------------------------------------------------------------------------
# 环境通用配置
# -----------------------------------------------------------------------------
# 默认测试环境地址
host: 172.22.3.150

# 存储池类型 (ceph/usan/local/nfs/xstor等)
stor: zbs

# 默认测试数据
data: Autotest

# 登录用户名
username: admin

# 登录密码
password: keystone_sugon

# 镜像源地址
image_source: http://172.22.5.66:9090

# 默认测试镜像
image: centos7.9_test.raw

# SSH私钥名称
pkey: pkey_scloudadmin

# 默认公网网络
network: public_net(基础版)

# -----------------------------------------------------------------------------
# BMS 裸金属回归基线配置
# -----------------------------------------------------------------------------
bms:
  # BMS 操作用例复用的实例名称
  instance_name: bms-0430
  # BMS 带外 IP
  bmc_ip: 172.22.2.173
  # BMS 优先使用的物理节点
  preferred_node: master02.cloud.local
  # BMS 网络名称
  network_name: bms
  # BMS 实例登录密码
  password: admin1234@sugon
  # BMS 创建/重建使用的裸金属镜像
  image_name: centos76-bms-0511-autotest
  # BMS 裸金属镜像在控制节点上的目标路径
  image_file: /home/scloudadmin/centos76-bms-0511.raw
  # BMS 裸金属镜像下载地址
  image_url: http://172.22.5.66:9090/offlinePackage/image_download/support-fsagent/centos76-bms-0511.raw
  # BMS 镜像导入后端和最小系统盘
  image_backend: bms
  image_min_disk: 50

# XStor存储配置
xstor: |
  iscsi_helper=lioadm
  volume_group=cinder-volumes
  thin_provision=1
  srv_port=3260
  username=optadmin
  password=NzBfMTA1XzExNF8xMTBfMTE1XzY5XzU0XzU1XzU2
  iscsi_restful_ip=172.22.1.61
  iscsi_svip=172.22.88.60
  storage_pool_id=5
