# =============================================================================
# SugonCloud Web 自动化测试框架 - 基础配置文件
# =============================================================================

# -----------------------------------------------------------------------------
# 浏览器配置
# -----------------------------------------------------------------------------

# 浏览器类型 (chromium/firefox/webkit)
browser: chromium

# 无头模式 (true无界面/false有界面)
headless: false

# 操作超时时间(毫秒)
timeout: 10000

# 操作延迟时间(毫秒)
slow_mo: 0

# -----------------------------------------------------------------------------
# 环境通用配置
# -----------------------------------------------------------------------------
# 默认测试环境地址
host: 172.22.3.150

# 存储池类型 (ceph/usan/local/nfs/xstor等)
stor: zbs

# 默认测试数据
data: Autotest

# 默认测试用户角色 (admin/dept_admin/user)
user_role: user

# 各角色登录凭据（按角色固化配置）
users:
  admin:
    username: admin
    password: keystone_sugon
  dept_admin:
    username: sugoncloud
    password: Sugon@12345
    project: "公共测试"
  user:
    username: autotest-user
    password: Sugon@12345
    project: "公共测试"

# 镜像源地址
image_source: http://172.22.5.66:9090

# 默认测试镜像
image: centos7.9_test.raw

# SSH私钥名称
pkey: pkey_scloudadmin

# 默认公网网络
network: public_net(基础版)

# -----------------------------------------------------------------------------
# BMS 裸金属回归基线配置
# -----------------------------------------------------------------------------
bms:
  # BMS 操作用例复用的实例名称
  instance_name: bms-0430
  # BMS 带外 IP
  bmc_ip: 172.22.2.173
  # BMS 优先使用的物理节点
  preferred_node: master02.cloud.local
  # BMS 网络名称
  network_name: bms
  # BMS 实例登录密码
  password: admin1234@sugon

# XStor存储配置
xstor: |
  iscsi_helper=lioadm
  volume_group=cinder-volumes
  thin_provision=1
  srv_port=3260
  username=optadmin
  password=NzBfMTA1XzExNF8xMTBfMTE1XzY5XzU0XzU1XzU2
  iscsi_restful_ip=172.22.1.61
  iscsi_svip=172.22.88.60
  storage_pool_id=5
