# 前端工程模块映射表
# 用途：把"测试模块/功能名"映射到对应前端工程目录，并规定在该目录下【先精准定位、再规范阅读】相关代码，
#       供阶段二写定位、阶段三改定位时"有据可依"地把真实前端元素翻译成稳定的 Page 定位（绝不凭印象猜）。
#
# 表格式：前端工程目录名(key) -> {aliases: [该 key 对应的功能模块/缩写/中文名列表], repo_url: 代码仓库地址}
# - repo_url 仅作记录参考，【不用于实际读取】；前端代码实际通过本地目录 `sugon_web/refrence/{版本目录}/{key}/` 读取。
# - aliases 首项为 key 的标准缩写/英文名，其后为各子模块缩写与中文描述；全部匹配【不区分大小写】。
#
# === 一、模块匹配策略：先定位到"模块目录"（4 级递进，均不区分大小写） ===
# 1）确定前端工程根路径：Bash 执行 `ls -d sugon_web/refrence/*/` 列出子目录取目录名；多个版本目录则用
#    `ls -td sugon_web/refrence/*/` 按修改时间倒序取第一个。
# 2）确定测试模块名：从阶段一 MD 的存放路径推断（如 case_specs/network/ → "网络"），或从 CSV 文件名/用户所提模块名推断。
# 3）读本文件 modules，对该模块名按 4 级策略定位唯一 key：
#    第1级（精确=key）：模块名与某 key 完全一致 -> 用该 key。
#    第2级（精确=缩写）：模块名与某 aliases 中任一项完全一致 -> 用该 key（如 VPC/SLB/ER/TM->vpc，EVS->evs；避免短缩子串误匹配）。
#    第3级（模糊匹配 aliases）：在所有 aliases 里模糊搜模块名——只命中一个 key 直接用；命中多个 key 则结合阶段一 MD 内容
#      二次筛选（在 MD 中统计各候选 key 本身及其子模块缩写的出现频次，取最高者）；仍无法区分则优先 mysql（数据库类默认），
#      再不行进入第4级。
#    第4级（无法定位）：第1~3级均未命中唯一 key -> 匹配失败。
# 4）匹配成功后检查该 key 的 repo_url：为空字符串视为匹配失败；非空则路径 = `根路径/key 目录`，到该目录下查阅前端代码。
# 5）匹配失败（搜不到 / 第3级歧义无法消解 / 目录不存在）-> 立即停止任务，在对话框醒目提示：
#    已结束本任务，因为无法找到与本任务对应的前端工程目录，请直接告知该任务对应的前端工程目录，以便继续执行本任务。
#
# === 二、模块目录内"精准定位到相关文件"（关键：既不整目录通读、又不漏关键文件） ===
# 一个模块目录常含几十个 .vue/.js、体量很大，【绝不要整目录/整模块通读】（浪费 token、引入无关内容、易撑爆上下文）。
# 定位到模块目录后，按"需求 -> 检索词 -> 文件"逐步收敛到承载本次功能的少数几个文件：
# 1）从需求 MD/CSV 提取检索词：功能名（如"负载均衡/转发规则/资源池"）、按钮与字段文案（如"新建/立即创建/子网/规格"）、
#    页面路由 hash（如 #/create-load-balancer）、组件/类名。
# 2）用 Grep 在模块目录内搜这些检索词，定位到承载该功能的具体 .vue 组件（列表页/详情页/弹窗/表单组件）及其路由定义（router 下 .js）；
#    复杂目录可先用 Agent 做探索、快速锁定候选文件。
# 3）只对【命中的相关组件文件】精读，其余无关文件不读。
#
# === 三、相关文件的"规范阅读"要求（保证定位质量，不许跳读/猜） ===
# 对第二步命中的相关组件文件，必须【把命中处及其上下文读全读透】，重点看清：
# - template：真实元素文案、placeholder、组件类型（el-input/el-select/el-radio/el-table/自研 cl-*·cloud-*）、
#   form-item 的 prop（哪些字段必填）、v-if/v-show/v-limit 条件渲染、:disabled 等运行态约束、teleport/append-to-body 的弹窗与下拉；
# - script：下拉选项数据来源（:label/:value 取自哪个 data/接口）、@change/@click 等事件、表单校验 rules、提交按钮的 disabled 条件、字段联动；
# - 据此区分"源码 != 运行态"的部分（teleport 弹窗/下拉、动态/i18n 文案、异步加载、运行态 disabled），这些一律【再用 recon_page.py 取运行态确认】。
# 【严禁】仅凭文件名/印象猜定位；【严禁】只读片段就略过同一组件里影响定位的关键部分（必填项、校验 rules、字段联动、提交按钮启用条件）。
#
# === 四、搜索工具约束（查阅前端代码必须遵守） ===
# - 必须用专用搜索工具（Agent / Grep / Glob / Read）；不要用 Bash(find/grep/python -c ...) 等 shell 命令搜文件——
#   shell 会绕过专用工具的优化逻辑、结果不完整。
# - 推荐流程：Agent 复杂目录探索锁定候选文件 -> Grep 精确搜元素选择器/按钮文案/路由 -> Read 精读命中的关键组件。
# - 禁止：① 整目录/整模块批量通读；② 用 shell 脚本遍历文件做内容匹配；③ 把前端代码复制进测试文件（破坏引用关系）。

