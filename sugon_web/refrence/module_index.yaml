# 前端工程模块映射表
# 格式：前端工程目录名 -> {aliases: [对应的功能模块列表], repo_url: 该模块前端工程的代码仓库地址}
# repo_url 说明：对应模块前端源码的 Git 仓库链接，AI 可通过该地址读取前端工程代码以辅助定位页面元素
# 前端工程根目录：sugon_web/refrence/ 下的唯一版本目录（如 full-stack-cloud）, 由 AI 运行时动态获取
# 搜索规则：AI 根据测试模块名，在 aliases 列表中进行模糊匹配（不区分大小写），命中则定位到对应的 key 目录
# 为保证匹配精准，每个 aliases 列表的首项为 key 的标准缩写/英文名，后续为各子模块缩写和中文描述
#
# === 模块匹配策略（4级递进策略，搜索均不区分大小写） ===
# 执行步骤：
# 1）确定前端工程根路径：通过 Bash 执行 `ls -d sugon_web/refrence/*/` 列出所有子目录，取目录名作为根路径。
#    若存在多个版本目录，执行 `ls -td sugon_web/refrence/*/` 按修改时间倒序，取第一个。
# 2）确定测试模块名：从阶段一产出的 MD 文件存放路径推断（如 case_specs/network/ 对应"网络"模块），
#    或从 CSV 文件名、用户在对话中提到的模块名推断。
# 3）读取本文件（module_index.yaml），先过滤掉 aliases 列表中包含"废弃"或"禁止参考"字样的 key
#    （这些为废弃或未启用模块，不参与匹配），然后对剩余模块按以下4级策略定位前端工程目录：
#    第1级（精确匹配 key）：模块名与某个 key 完全一致 -> 直接使用该 key。
#    第2级（精确匹配缩写）：模块名与某个 aliases 列表中的任何一项完全一致 -> 使用该 key。
#      例如 VPC、SLB、ER、TM 命中 vpc；EVS 命中 evs。此级避免短缩落入子串匹配产生误匹配。
#    第3级（模糊匹配 aliases 列表）：在所有 aliases 列表中模糊搜索模块名。
#      - 若只命中一个 key -> 直接使用。
#      - 若命中多个 key -> 结合阶段一产出的 MD 文件内容二次筛选：在 MD 中搜索各候选 key 的标识
#        （key 本身、aliases 列表中的各子模块缩写），统计出现频次，取最高者。
#      - 二次筛选后仍无法区分 -> 进入第4级。
#    第4级（无法定位）：第1~3级均未命中唯一 key -> 视为匹配失败。
# 4）若匹配成功，拼接 `根路径/匹配的目录名` 得到完整路径，读取该路径下的前端工程代码。
# 5）若匹配失败（modules 中搜索不到、第3级歧义无法消解、或对应目录不存在），
#    立即停止任务，并在对话框中输出醒目提示：已结束本任务，因为无法找到与本任务对应的前端工程目录，
#    请直接告知该任务对应的前端工程目录，以便继续执行本任务。
#
# === 前端代码搜索工具约束（查阅前端代码时必须遵守） ===
# - 必须使用专用搜索工具（Grep、Glob、Agent 或 Read）。
#   不要使用 Bash(python -c ...) 或 Bash(find/grep/...) 等 shell 命令做文件搜索，
#   shell 命令会绕过专用搜索工具的优化逻辑，导致搜索结果不完整。
# - 推荐策略：先通过 Agent 工具（用于复杂目录探索）快速定位目标模块目录和关键文件 ->
#   再通过 Grep 精确搜索元素选择器、按钮文案 -> 最后通过 Read 精读关键组件文件。
# - 禁止行为：
#   1. 不要批量读取整个前端目录。批量读取会浪费 token 且引入无关内容。
#   2. 不要用 shell 脚本遍历文件做内容匹配。
#   3. 不要把前端代码复制到测试文件中。复制前端代码会破坏引用关系。

