# 测试数据配置
evs:
  test_ecs_modify_spec:
    - spec:
      基础规格: False
      CPU: "2"
      Mem: "6"
      desc: "自定义规格修改2核6GiB"
    - spec:
      基础规格: True
      "classify": "计算型"
      CPU: "4"
      Mem: "8"
      desc: "修改为计算型4核8G"
    - spec:
      基础规格: True
      "classify": "通用型"
      CPU: "4"
      Mem: "16"
      desc: "修改为通用型4核16G"
    - spec:
      基础规格: True
      "classify": "内存型"
      CPU: "4"
      Mem: "32"
      desc: "修改为内存型4核32G"
  test_ecs_operations:
    - param:
      operation: "关机"
      desc: "实例关机成功"
      status: "关机"
    - param:
      operation: "启动"
      desc: "实例启动成功"
      status: "运行"
    - param:
      operation: "重启"
      desc: "实例重启成功"
      status: "运行"
    - param:
      operation: "强制重启"
      desc: "实例强制重启成功"
      status: "运行"
    - param:
      operation: "强制关机"
      desc: "实例强制关机成功"
      status: "关机"
    - param:
      operation: "启动"
      desc: "实例启动成功"
      status: "运行"
    - param:
      operation: "挂起"
      desc: "实例挂起成功"
      status: "挂起"
    - param:
      operation: "恢复运行"
      desc: "实例恢复运行成功"
      status: "运行"
    - param:
      operation: "暂停"
      desc: "实例暂停成功"
      status: "暂停"
    - param:
      operation: "取消暂停"
      desc: "实例恢复运行成功"
      status: "运行"
  test_ecs_network:
    - network_info:
      net: "Autotest"