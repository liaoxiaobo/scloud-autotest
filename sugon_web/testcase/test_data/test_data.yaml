# 测试数据配置
evs:
  test_volume_create:
    # 普通云硬盘测试
    - empty: true
      size: 100
      desc: "中等容量空白云硬盘"
      shared: false
    - empty: false
      size: 500
      desc: "大容量镜像云硬盘"
      shared: false

    # 共享云硬盘测试
    - empty: true
      size: 500
      desc: "大容量共享空白云硬盘"
      shared: true
    - empty: false
      size: 100
      desc: "中等容量共享镜像云硬盘"
      shared: true

  test_modify:
    - name_suffix: "-modified"
      new_desc: "修改后的描述信息"
    - name_suffix: "_v2"
      new_desc: "这是一个很长的描述，用于测试系统对长文本的处理能力，包含中文字符和特殊符号！@#￥%……&*（）"
    - name_suffix: "_backup"
      new_desc: "Backup snapshot with updated description"

  test_volume_expand:
    - new_size: 100
    - new_size: 500
    - new_size: 1200

  test_volume_add_snapshot:
    - snapshot_name_prefix: "snapshot-"
      desc: "基础快照测试"
    - snapshot_name_prefix: "backup-"
      desc: "三生三世十里桃花"
    - snapshot_name_prefix: "daily-"
      desc: "Daily backup snapshot for testing purposes with long description"
    - snapshot_name_prefix: "test-"
      desc: "包含特殊字符的快照描述！@#￥%……&*（）测试"

