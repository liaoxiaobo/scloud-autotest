  test_lb_detail_edit:
    - title: "名称"
      field: "name"
      new_name_suffix: "-edit"

    - title: "描述"
      field: "desc"
      new_desc: "autotest listener description"

    - title: "前端端口"
      field: "port"
      new_port: 65535

    - title: "访问控制"
      field: "access_control"
      enable: true
      policy: "白名单"

  test_lb_pool_add_resource:
    - case_desc: "单资源-常规端口"
      vm_count: 1
      ports: 8080

    - case_desc: "多资源-不同端口"
      vm_count: 2
      ports:
        - 8080
        - 8081

    - case_desc: "单资源-最小端口"
      vm_count: 1
      ports: 1

    - case_desc: "单资源-最大端口"
      vm_count: 1
      ports: 65535
