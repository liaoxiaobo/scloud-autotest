  common_backup:
    - 策略类型: "自定义策略"
      时间策略:
        备份方式: "周期性备份"
        时间策略信息:
          - 备份类型: "全量备份"
            备份周期: "每周"
            备份频率: "每周"
            备份时间: [ "星期二", "星期六" ]
            执行时间: "01:00:00"
          - 备份类型: "增量备份"
            备份周期: "每周"
            备份频率: "每周"
            备份时间: [ "星期一", "星期五" ]
            执行时间: "01:00:00"
########################################################################################################################
  # 一次性备份策略
  test_backup_once:
    - case_name: "一次性+永久限速+存储全开+天数保留+快照开启"
      策略类型: "自定义策略"
      时间策略:
        备份方式: "一次性备份"
      限速策略:
        限速方式: "永久限速"
        限速大小: "200"
        单位: "MiB/s"
      存储策略:
        重复数据删除: "关闭"
        压缩存储: "关闭"
        数据加密: "开启"
      保留策略:
        数据保留方式: "天数"
        保留数: "30"
      高级策略:
        快照保留: "开启"
        线程数: "4"
