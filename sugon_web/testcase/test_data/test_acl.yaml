acl:
  test_acl_rule_create_scenarios:
    # IPv4 允许
    - desc: "允许_IPv4_全部"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "允许"
      protocol: "全部"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
    - desc: "允许_IPv4_TCP"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "允许"
      protocol: "TCP"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
      source_port: "1-65535"
      dest_port: "8080"
    - desc: "允许_IPv4_UDP"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "允许"
      protocol: "UDP"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
      source_port: "1-65535"
      dest_port: "8080"
    - desc: "允许_IPv4_ICMP"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "允许"
      protocol: "ICMP"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"

    # IPv4 拒绝
    - desc: "拒绝_IPv4_全部"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "拒绝"
      protocol: "全部"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
    - desc: "拒绝_IPv4_TCP"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "拒绝"
      protocol: "TCP"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
      source_port: "1-65535"
      dest_port: "8080"
    - desc: "拒绝_IPv4_UDP"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "拒绝"
      protocol: "UDP"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
      source_port: "1-65535"
      dest_port: "8080"
    - desc: "拒绝_IPv4_ICMP"
      direction: "入方向"
      ip_version: "IPv4"
      policy: "拒绝"
      protocol: "ICMP"
      source_ip: "0.0.0.0/0"
      dest_ip: "10.0.0.0/24"
