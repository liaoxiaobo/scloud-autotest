# 测试数据配置
evs:
  test_ecs_modify_spec:
    - spec:
      spec_type: False
      CPU: "2"
      Mem: "6"
      desc: "自定义规格修改2核6GiB"
    - spec:
      spec_type: True
      classify: "计算型"
      CPU: "4"
      Mem: "8"
      desc: "修改为计算型4核8G"
    - spec:
      spec_type: True
      classify: "通用型"
      CPU: "4"
      Mem: "16"
      desc: "修改为通用型4核16G"
    - spec:
      spec_type: True
      classify: "内存型"
      CPU: "4"
      Mem: "32"
      desc: "修改为内存型4核32G"
  test_ecs_operations:
    - param:
      operation: "关机"
      desc: "实例关机成功"
      status: "关机"
      vm_state: "stopped"
    - param:
      operation: "启动"
      desc: "实例启动成功"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "挂起"
      desc: "实例挂起成功"
      status: "挂起"
      vm_state: "suspended"
    - param:
      operation: "恢复运行"
      desc: "实例恢复运行成功"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "暂停"
      desc: "实例暂停成功"
      status: "暂停"
      vm_state: "paused"
    - param:
      operation: "取消暂停"
      desc: "实例恢复运行成功"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "重启"
      desc: "实例重启成功"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "强制重启"
      desc: "实例强制重启成功"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "强制关机"
      desc: "实例强制关机成功"
      status: "关机"
      vm_state: "stopped"
    - param:
      operation: "启动"
      desc: "实例启动成功"
      status: "运行"
      vm_state: "active"
  test_ecs_network:
    - network_info:
      net: "Autotest"
      subnet: "subnet"
  test_ecs_bind_unbind_group:
    - param:
      operation: "绑定亲和组"
      group_name: "caowl-反亲和"
    - param:
      operation: "解绑亲和组"
      group_name: "caowl-反亲和"
  test_ecs_batch_operations:
    - param:
      operation: "批量关机"
      status: "关机"
      vm_state: "stopped"
    - param:
      operation: "批量启动"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "批量重启"
      status: "运行"
      vm_state: "active"
    - param:
      operation: "批量强制重启"
      status: "运行"
      vm_state: "active"
  test_ecs_cpu_qos:
    - param:
      priority: "低"
      ceiling: "0.2"
      expection:
        quota:cpu_quota: "200000.0"
        quota:cpu_shares: "256"
        quota:cpu_period: "1000000"
    - param:
      priority: "高"
      ceiling: "1"
      expection:
        quota:cpu_quota: "1000000.0"
        quota:cpu_shares: "4096"
        quota:cpu_period: "1000000"