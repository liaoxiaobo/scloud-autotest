[pytest]
# 最低pytest版本要求
minversion = 7.4.0

# 测试路径
testpaths = sugon_web/testcase

# 控制台输出中文乱码问题
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True


# 默认命令行选项
addopts =
    -v
    -m 'not slow'
    --tb=short
    --strict-markers
    --strict-config
;    --alluredir=allure-result  # 由 conftest.py 动态设置
    --clean-alluredir

# 自定义标记
markers =
    smoke: 冒烟测试
    slow: 慢速测试
    evs: 云硬盘相关测试
    ecs: 弹性云服务器相关测试
    # 模块级
    backup: 备份测试
    compute: 计算服务测试
    container: 容器服务测试
    database: 数据库测试
    iam: 身份认证测试
    middleware: 中间件测试
    network: 网络服务测试
    security: 安全服务测试
    storage: 存储服务测试
    # 服务级
    back: 备份
    bms: 裸金属服务器
    cce: 云容器引擎
    doris: 数据仓库Doris
    kingbase: 人大金仓KingbaseES
    mongodb: MongoDB
    mysql: MySQL
    pgsql: PostgreSQL
    xscale: XScale
    es: 云搜索服务CSS
    kafka: 分布式消息服务Kafka
    redis: Redis
    acl: 网络ACL
    ca: CA证书
    dc: 云专线
    eip: 弹性公网IP
    er: 企业路由器
    internal_dns: 内网解析
    ip_group: IP地址组
    lb: 监听器
    nat: NAT网关
    peer_connect: 对等连接
    qos: 网络QoS
    sg: 安全组
    slb: 负载均衡
    slbv1: 负载均衡V1
    slbv2: 负载均衡V2
    tm: 流量镜像
    vpc: 虚拟私有云
    apt: 攻击预警
    usm: 云堡垒机
    ver: 日志审计
    obs: 对象存储

# 测试文件和函数命名模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 控制台日志配置
log_cli = true
log_cli_level = INFO
log_auto_indent = true
log_cli_format = %(asctime)s.%(msecs)03d [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 文件日志配置
# log_file = logs/pytest.log  # 由 conftest.py 动态设置
log_file_level = INFO
log_file_format = %(asctime)s.%(msecs)03d [%(levelname)s] %(filename)s:%(lineno)d %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 忽略的目录
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    allure-result
    allure-report
    screenshots
    logs

# 过滤警告
;filterwarnings =
;    ignore::DeprecationWarning
;    ignore::PendingDeprecationWarning
;    ignore:.*playwright.*:UserWarning

# 并行执行配置（如果使用pytest-xdist）
# addopts = -n auto

# JUnit XML报告（如果需要CI集成）
# junit_family = xunit2
