[pytest]
# 最低pytest版本要求
minversion = 7.4.0

# 测试路径
testpaths = sugon_web/testcase

# 控制台输出中文乱码问题
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True


# 默认命令行选项
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
;    --alluredir=allure-result  # 由 conftest.py 动态设置
    --clean-alluredir

# 自定义标记
# 说明：
# - smoke / slow 是通用 mark，保留为静态声明，确保始终可用。
# - 其余模块级（backup/compute/container/...）和服务级（cce/ecs/evs/obs/...）
#   mark 全部由 sugon_web/testcase/conftest.py::pytest_configure 根据目录和文件名
#   自动扫描、动态注册。新增 testcase/<module>/test_<service>_*.py 文件时，
#   无需再修改本文件即可被 -m 参数正确筛选。
markers =
    smoke: 冒烟测试
    slow: 慢速测试
    bms: 裸金属BMS相关测试
    bms_prepare: BMS环境准备/创建类测试
    bms_regression: BMS日常功能回归测试
    bms_destructive: BMS高风险/破坏性测试
    preflight: 自动化运行前环境前置检查
    preflight_resource: 资源/配额前置检查
    preflight_health: 环境健康前置检查
    preflight_frontend: 前端可用性检查
    preflight_backend: 后台健康检查
    preflight_inspection: 运维一键巡检

# 测试文件和函数命名模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 控制台日志配置
log_cli = true
log_cli_level = INFO
log_auto_indent = true
log_cli_format = %(asctime)s.%(msecs)03d [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 文件日志配置
# log_file = logs/pytest.log  # 由 conftest.py 动态设置
log_file_level = INFO
log_file_format = %(asctime)s.%(msecs)03d [%(levelname)s] %(filename)s:%(lineno)d %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 忽略的目录
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    allure-result
    allure-report
    screenshots
    logs

# 过滤警告
;filterwarnings =
;    ignore::DeprecationWarning
;    ignore::PendingDeprecationWarning
;    ignore:.*playwright.*:UserWarning

# 并行执行配置（如果使用pytest-xdist）
# addopts = -n auto

# JUnit XML报告（如果需要CI集成）
# junit_family = xunit2
